<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>同期解錠 - 主役</title>
    <style>
        body { background: #1a1a2e; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { background: #16213e; padding: 30px; border-radius: 20px; max-width: 450px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        button { background: #e94560; color: white; border: none; padding: 18px 36px; font-size: 1.5rem; border-radius: 30px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #555; cursor: not-allowed; }
        .room-display { background: #0f3460; padding: 15px; border-radius: 12px; margin: 15px 0; }
    </style>
</head>
<body>
<div class="container">
    <h2>🔒 2人同時タップ解錠</h2>
    <p>このプレゼントは2人のスマホで<br>「せーの」で同時に押さないと開かないよ！</p>
    
    <div class="room-display">
        <span style="color:#aaa; font-size:0.9rem;">相手に伝えるROOM ID</span><br>
        <strong id="display-room-id" style="color:#ff4757; font-size:2rem;">----</strong>
    </div>

    <button id="push-btn" onclick="pushButton()">せーの！(PUSH)</button>
    <p id="status-msg" style="color:#f8b500; font-weight:bold; margin-top:15px; min-height: 1.5em;"></p>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxFj7_MKG2fp1I3vVtfZCxrktdlRDUYoQqnKHJVKUaYwEdD6OboI56Q4QM5MpU83y6B/exec";
    const myRole = "host";
    
    // ROOM IDを一時保存（リロードしてもIDが変わらないように保持）
    let currentRoomId = sessionStorage.getItem('roomId');
    if (!currentRoomId) {
        currentRoomId = Math.floor(1000 + Math.random() * 9000).toString();
        sessionStorage.setItem('roomId', currentRoomId);
    }
    
    document.getElementById('display-room-id').innerText = currentRoomId;
    let checkInterval = null;

    function pushButton() {
        if (checkInterval) clearInterval(checkInterval);

        document.getElementById('push-btn').disabled = true;
        document.getElementById('status-msg').innerText = "⏳ 相手が押すのを待っています...";

        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'push', roomId: currentRoomId, role: myRole, time: Date.now() })
        }).then(() => {
            checkInterval = setInterval(checkResult, 800);
        });
    }

    function checkResult() {
        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'check', roomId: currentRoomId })
        })
        .then(res => res.json())
        .then(data => {
            if (data.result === 'success') {
                clearInterval(checkInterval);
                sessionStorage.setItem('giftUrl', data.giftUrl);
                location.href = 'gift.html';

            } else if (data.result === 'fail') {
                clearInterval(checkInterval);
                
                // 誤差と元ページを保存して fail.html に遷移
                sessionStorage.setItem('lastDiff', data.diff);
                sessionStorage.setItem('prevSyncPage', 'host-sync.html');

                fetch(GAS_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ action: 'reset', roomId: currentRoomId }) 
                }).then(() => {
                    location.href = 'fail.html';
                });
            }
        });
    }
</script>
</body>
</html>
