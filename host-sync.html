<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>同期解錠 - ホスト</title>
    <style>
        body { background: #1a1a2e; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { background: #16213e; padding: 30px; border-radius: 20px; max-width: 450px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { padding: 10px; font-size: 1.1rem; border-radius: 8px; border: 2px solid #e94560; text-align: center; width: 80%; margin-bottom: 15px; font-weight: bold; }
        button { background: #e94560; color: white; border: none; padding: 18px 36px; font-size: 1.5rem; border-radius: 30px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:disabled { background: #555; cursor: not-allowed; }
        .room-display { background: #0f3460; padding: 12px; border-radius: 12px; margin: 15px 0; }
    </style>
</head>
<body>
<div class="container">
    <h2>🔒 同時タップで解錠</h2>
    
    <div class="room-display">
        <span style="color:#aaa; font-size:0.85rem;">相手に伝える ROOM ID</span><br>
        <strong id="display-room-id" style="color:#ff4757; font-size:2rem;">----</strong>
    </div>

    <div style="margin: 15px 0;">
        <label style="font-size: 0.9rem; color: #ccc;">事前に共有したパスワード (PSK)</label><br>
        <input type="password" id="psk-input" placeholder="PSKを入力">
    </div>

    <button id="push-btn" onclick="pushButton()">せーの！(PUSH)</button>
    <p id="status-msg" style="color:#f8b500; font-weight:bold; margin-top:15px; min-height: 1.5em;"></p>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxFj7_MKG2fp1I3vVtfZCxrktdlRDUYoQqnKHJVKUaYwEdD6OboI56Q4QM5MpU83y6B/exec";
    const myRole = "host";
    
    let currentRoomId = sessionStorage.getItem('roomId');
    if (!currentRoomId) {
        currentRoomId = Math.floor(1000 + Math.random() * 9000).toString();
        sessionStorage.setItem('roomId', currentRoomId);
    }
    document.getElementById('display-room-id').innerText = currentRoomId;
    let checkInterval = null;

    function pushButton() {
        const psk = document.getElementById('psk-input').value.trim();
        if (!psk) return alert('合言葉(PSK)を入力してね！');

        if (checkInterval) clearInterval(checkInterval);

        document.getElementById('push-btn').disabled = true;
        document.getElementById('status-msg').innerText = "⏳ 相手が押すのを待っています...";

        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'push', roomId: currentRoomId, role: myRole, time: Date.now(), psk: psk })
        })
        .then(res => res.json())
        .then(data => {
            if (data.result === 'auth_error') {
                alert(data.message);
                document.getElementById('push-btn').disabled = false;
                document.getElementById('status-msg').innerText = "";
                return;
            }
            checkInterval = setInterval(() => checkResult(psk), 800);
        })
        .catch(() => {
            document.getElementById('push-btn').disabled = false;
            document.getElementById('status-msg').innerText = "通信エラーが発生しました";
        });
    }

    function checkResult(psk) {
        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'check', roomId: currentRoomId, psk: psk })
        })
        .then(res => res.json())
        .then(data => {
            if (data.result === 'waiting') return;

            if (data.result === 'success') {
                clearInterval(checkInterval);
                sessionStorage.setItem('giftUrl', data.giftUrl);
                location.href = 'gift.html';

            } else if (data.result === 'fail') {
                clearInterval(checkInterval);
                const sec = (data.diff / 1000).toFixed(2);
                
                // ボタンと表示を元に戻す
                document.getElementById('push-btn').disabled = false;
                document.getElementById('status-msg').innerText = "";

                alert(`失敗！(誤差: ${sec}秒)\nもう一度せーので押してね！`);
            }
        })
        .catch(() => {});
    }
</script>
</body>
</html>
