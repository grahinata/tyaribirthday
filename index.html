<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body { background: #1a1a2e; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .container { background: #16213e; padding: 30px; border-radius: 20px; max-width: 450px; margin: 0 auto; }
        .page { display: none; }
        .active { display: block; }
        button { background: #e94560; color: white; border: none; padding: 14px 28px; font-size: 1.1rem; border-radius: 30px; margin: 10px; font-weight: bold; }
        button.secondary { background: #0f3460; }
        input { padding: 12px; font-size: 1.2rem; border-radius: 8px; border: 2px solid #e94560; text-align: center; width: 70%; margin-bottom: 10px; }
        .gift-btn { background: #00d26a; font-size: 1.2rem; padding: 15px 30px; color: white; text-decoration: none; border-radius: 30px; display: inline-block; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <!-- PAGE 1: 注意書き -->
    <div id="page1" class="page active">
        <h2>⚠️ 音量ご注意</h2>
        <p>次のページでバースデーソングが流れます。<br>音量を調整して進んでね！</p>
        <button onclick="nextPage(2, true)">🔊 音ありで進む</button> <br>
        <button class="secondary" onclick="nextPage(2, false)">🔇 無音で進む</button>
    </div>

    <!-- PAGE 2: メイン -->
    <div id="page2" class="page">
        <h1 style="color: #ff4757;">🎉 Happy Birthday! 🎉</h1>
        <p>誕生日おめでとう！！</p>
        <div style="font-size: 80px; margin: 20px 0;">🎂</div>
        <button onclick="nextPage(3, false)">🎁 プレゼントを受け取る</button>
        <audio id="bgm" src="https://actions.google.com/sounds/v1/ambiences/carnival_music.ogg" loop></audio>
    </div>

    <!-- PAGE 3: GAS連携同期 -->
    <div id="page3" class="page">
        <h2>🔒 2人同時タップ解錠</h2>
        <p>「せーの」で同時にボタンを押してね！</p>
        
        <div id="setup-section">
            <p>役割を選んでね：</p>
            <button onclick="setupRole('host')">主役（ホスト）</button>
            <button onclick="setupRole('client')" class="secondary">彼女さん（接続）</button>
        </div>

        <div id="room-section" style="display:none; margin-top:15px;">
            <p id="room-desc">同じ4桁のROOM IDを2人で決めて入力してね：</p>
            <input type="number" id="room-id-input" placeholder="例: 1234"> <br>
            <button id="push-btn" style="background:#ff4757; font-size:1.4rem;" onclick="pushButton()">せーの！(PUSH)</button>
            <p id="status-msg" style="color:#f8b500; font-weight:bold; margin-top:15px;"></p>
        </div>
    </div>

    <!-- PAGE 4: ギフト -->
    <div id="page4" class="page">
        <h1 style="color: #00d26a;">🔓 解錠成功！！</h1>
        <p>おめでとう！完璧なタイミングでした！</p>
        <div style="font-size: 80px; margin: 10px 0;">🎁</div>
        <a href="https://gift.starbucks.co.jp/" target="_blank" class="gift-btn">☕ ギフトを受け取る</a>
    </div>
</div>

<script>
    // ⚠️ ここに自分のGASウェブアプリのURLを貼り付ける ⚠️
    const GAS_URL = "https://script.google.com/macros/s/AKfycbym4KE82J3gNw8BLqvvsisTJbtVLl9m63rPG5NnHSplvKQ35JBLm-Hv59MoKzUwtTASSA/exec";

    let myRole = "";
    let checkInterval = null;

    function nextPage(pageNum, sound) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('page' + pageNum).classList.add('active');
        if (pageNum === 2) {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            if (sound) document.getElementById('bgm').play().catch(()=>{});
        }
    }

    function setupRole(role) {
        myRole = role;
        document.getElementById('setup-section').style.display = 'none';
        document.getElementById('room-section').style.display = 'block';
    }

    function pushButton() {
        const roomId = document.getElementById('room-id-input').value.trim();
        if (!roomId) return alert('4桁のROOM IDを入力してね');

        document.getElementById('push-btn').disabled = true;
        document.getElementById('status-msg').innerText = "判定中... 相手の押し待ちです";

        // GASへ押下時間を送信
        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'push', roomId: roomId, role: myRole })
        }).then(() => {
            // 結果の定期ポーリング開始（1秒おき）
            checkInterval = setInterval(() => checkResult(roomId), 1000);
        });
    }

    function checkResult(roomId) {
        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'check', roomId: roomId })
        })
        .then(res => res.json())
        .then(data => {
            if (data.result === 'success') {
                clearInterval(checkInterval);
                nextPage(4, false);
                confetti({ particleCount: 200, spread: 100, origin: { y: 0.4 } });
            } else if (data.result === 'fail') {
                clearInterval(checkInterval);
                const sec = (data.diff / 1000).toFixed(2);
                document.getElementById('status-msg').innerText = `ズレちゃった！(誤差: ${sec}秒)\nもう一度せーので押してね！`;
                setTimeout(() => {
                    document.getElementById('push-btn').disabled = false;
                    document.getElementById('status-msg').innerText = "";
                }, 2000);
            }
        });
    }
</script>

</body>
</html>
