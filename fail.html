<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>失敗！</title>
    <style>
        body { background: #1a1a2e; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { background: #16213e; padding: 30px; border-radius: 20px; max-width: 450px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        button { background: #e94560; color: white; border: none; padding: 15px 35px; font-size: 1.3rem; border-radius: 30px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1 style="color: #ff4757; font-size: 3rem;">💥 失敗！</h1>
    <p style="font-size: 1.2rem; font-weight: bold;">タイミングがズレちゃいました！</p>
    <p id="diff-time-msg" style="color: #f8b500; font-size: 1.2rem; margin: 20px 0;"></p>
    <p>しっかり息を合わせて「せーの！」で押してね！</p>
    
    <button onclick="retry()">🔄 もう一度チャレンジ</button>
</div>

<script>
    // 誤差の秒数を取得して表示
    const diff = sessionStorage.getItem('lastDiff');
    if (diff) {
        document.getElementById('diff-time-msg').innerText = `誤差: ${(diff / 1000).toFixed(2)}秒`;
    }

    function retry() {
        // 直前にいた同期画面（host-sync.html または client-sync.html）に戻る
        const prevPage = sessionStorage.getItem('prevSyncPage') || 'celebration.html';
        location.href = prevPage;
    }
</script>
</body>
</html>
